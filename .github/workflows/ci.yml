name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: |
          npm run typecheck --workspace=@crewcircle/knowledge
          npm run typecheck --workspace=@crewcircle/docs-gen

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint --workspace=@crewcircle/knowledge
          npm run lint --workspace=@crewcircle/docs-gen

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: |
          npm test --workspace=@crewcircle/knowledge
          npm test --workspace=@crewcircle/docs-gen

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build --workspace=@crewcircle/knowledge
          npm run build --workspace=@crewcircle/docs-gen

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/knowledge/dist
            packages/docs-gen/dist
          retention-days: 7

  docs:
    name: Generate Docs
    needs: [build]
    # Opt-in only: unset by default, so this job is skipped on every normal
    # push/PR until a maintainer sets the OPENWIKI_DOCS_ENABLED repository
    # (or org) variable to "true". Never runs on pull_request — an LLM pass
    # on every contributor's PR would be wasteful and noisy.
    if: github.event_name == 'push' && vars.OPENWIKI_DOCS_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/docs-generate.yml
    with:
      mode: engineering
    secrets: inherit

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install changesets
        run: npm install -g @changesets/cli

      - name: Check for changesets
        id: changesets
        run: |
          if npx changeset status --since=main; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ This PR has a changeset. Version bump will be applied on merge.'
            })