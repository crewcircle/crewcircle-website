name: Generate Docs (reusable)

# Generic OpenWiki-based documentation generation, shared across CrewCircle
# repos via @crewcircle/docs-gen. Called by this repo's own ci.yml (gated,
# default off) and by other CrewCircle repos as:
#   uses: crewcircle/crewcircle-website/.github/workflows/docs-generate.yml@main
#
# Requires the calling workflow to pass `secrets: inherit` (or explicitly
# forward OPENROUTER_API_KEY) so the shared org-wide OpenRouter key reaches
# this job.
#
# @crewcircle/docs-gen is NOT published to npm (blocked on an npm org/token
# permissions issue — see packages/docs-gen/README.md). Until that's sorted,
# this checks out crewcircle-website directly and builds the package from
# source rather than `npx`-installing it from the registry. OpenWiki itself
# is unaffected — it's a normal published third-party package, still
# installed via `npx` as usual.

on:
  workflow_call:
    inputs:
      mode:
        description: "Documentation audience: engineering (default) or client"
        type: string
        default: engineering
  workflow_dispatch:
    inputs:
      mode:
        description: "Documentation audience: engineering (default) or client"
        type: string
        default: engineering

jobs:
  generate:
    name: Generate Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          path: target
          persist-credentials: true

      - name: Checkout docs-gen source (crewcircle-website)
        uses: actions/checkout@v4
        with:
          repository: crewcircle/crewcircle-website
          path: docs-gen-src
          sparse-checkout: |
            packages/docs-gen
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build docs-gen
        working-directory: docs-gen-src/packages/docs-gen
        run: |
          npm install
          npm run build

      - name: Run OpenWiki via docs-gen
        working-directory: target
        run: node ../docs-gen-src/packages/docs-gen/dist/cli.js generate --mode=${{ inputs.mode }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Create documentation update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: target
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: docs/update
          commit-message: "docs: update generated documentation"
          title: "docs: update generated documentation"
          body: |
            Automated documentation update via `@crewcircle/docs-gen` (OpenWiki, mode: ${{ inputs.mode }}), built from source (git-based distribution — see workflow comments).
